<!DOCTYPE html><html class="light" lang="en"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>Kiosk Delivery Flow</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

                "on-primary": "#ffffff",
                "surface-container-highest": "#d8e2ff",
                "on-surface-variant": "#434654",
                "inverse-primary": "#b2c5ff",
                "on-tertiary-fixed-variant": "#004f58",
                "surface-container-low": "#f1f3ff",
                "error-container": "#ffdad6",
                "tertiary-fixed": "#9cf0ff",
                "outline-variant": "#c3c6d6",
                "on-secondary-container": "#004261",
                "error": "#ba1a1a",
                "surface-dim": "#ccdaff",
                "on-primary-fixed": "#001848",
                "tertiary-container": "#006470",
                "secondary-container": "#0cb3ff",
                "on-secondary": "#ffffff",
                "on-primary-fixed-variant": "#0040a2",
                "background": "#faf9ff",
                "on-background": "#051a3e",
                "on-secondary-fixed": "#001e2f",
                "on-tertiary-fixed": "#001f24",
                "primary-container": "#0052cc",
                "on-surface": "#051a3e",
                "tertiary-fixed-dim": "#00daf3",
                "surface-bright": "#faf9ff",
                "primary-fixed-dim": "#b2c5ff",
                "on-error": "#ffffff",
                "inverse-surface": "#1d3054",
                "tertiary": "#004a54",
                "surface-container-high": "#e1e8ff",
                "on-secondary-fixed-variant": "#004b6f",
                "outline": "#737685",
                "secondary-fixed-dim": "#8bceff",
                "primary": "#003d9b",
                "secondary": "#006492",
                "surface-tint": "#0c56d0",
                "primary-fixed": "#dae2ff",
                "on-error-container": "#93000a"
        },
        "borderRadius": {
                "DEFAULT": "0.25rem",
                "lg": "0.5rem",
                "xl": "0.75rem",
                "full": "9999px"
        },
        "spacing": {
                "kiosk-touch-target": "64px",
                "unit": "8px",
                "gutter": "16px",
                "touch-target-min": "48px",
                "container-margin-mobile": "16px",
                "container-margin-desktop": "32px"
        },
        "fontFamily": {
                "headline-md": [
                        "Inter"
                ],
                "display-lg-mobile": [
                        "Inter"
                ],
                "body-lg": [
                        "Inter"
                ],
                "label-md": [

                ],

        },
        "fontSize": {
                "headline-md": [

                "display-lg-mobile": [

                ],

                        "18px",
                        {
                                "lineHeight": "28px",
                                "fontWeight": "400"
                        }
                ],
                "label-md": [
                        "14px",
                        {
                                "lineHeight": "20px",
                                "letterSpacing": "0.01em",
                                "fontWeight": "500"
                        }
                ],
                "headline-lg": [
                        "32px",
                        {
                                "lineHeight": "40px",
                                "letterSpacing": "-0.01em",
                                "fontWeight": "600"
                        }
                ],
                "body-md": [
                        "16px",
                        {
                                "lineHeight": "24px",
                                "fontWeight": "400"
                        }
                ],
                "label-sm": [
                        "12px",
                        {
                                "lineHeight": "16px",
                                "letterSpacing": "0.03em",
                                "fontWeight": "600"
                        }
                ],
                "display-lg": [
                        "48px",

                                "letterSpacing": "-0.02em",

},
    },
  }
</script>
<style>
        /* Hide scrollbar for kiosk mode */
        body {
            overflow: hidden;
            touch-action: none; /* Prevent pinch-zoom on kiosk */
            user-select: none;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .icon-bold {
            font-variation-settings: 'FILL' 0, 'wght' 700, 'GRAD' 0, 'opsz' 48;
        }
    </style>
</head>
<body class="bg-surface h-screen w-screen flex flex-col font-body-md text-on-surface">
<!-- Kiosk Top Header -->
<header class="h-[10%] min-h-[80px] bg-surface-container-lowest border-b-2 border-outline-variant flex items-center justify-center shadow-sm z-10 px-container-margin-desktop">
<h1 class="font-display-lg text-display-lg text-primary tracking-tight">Giao Hàng Mới</h1>
</header>
<!-- Main Content Area (Middle 75%) -->
<main class="flex-1 flex px-container-margin-desktop py-8 gap-12 max-w-[1920px] mx-auto w-full">
<!-- Left Pane: Room Number Input -->
<section class="flex-1 flex flex-col gap-6 h-full bg-surface-container-lowest rounded-3xl p-8 border border-outline-variant shadow-[0_4px_12px_rgba(0,0,0,0.05)]">
<header class="flex items-center gap-4 border-b border-outline-variant pb-4">
<div class="w-12 h-12 rounded-full bg-primary flex items-center justify-center text-on-primary font-headline-lg text-headline-lg">1</div>
<h2 class="font-headline-lg text-headline-lg text-on-surface">Nhập Số Phòng</h2>
</header>
<!-- Display Field -->
<div class="h-28 bg-surface border-2 border-outline rounded-2xl flex items-center justify-center shadow-inner relative overflow-hidden transition-colors" id="display-container">
<span class="font-display-lg text-display-lg tracking-[0.5em] text-on-surface font-mono" id="room-display"></span>
<span class="absolute text-outline-variant font-display-lg text-display-lg tracking-[0.5em] font-mono pointer-events-none" id="room-placeholder">____</span>
</div>
<!-- Numeric Keypad -->
<div class="grid grid-cols-3 gap-4 flex-1 mt-2">
<!-- Keys 1-9 -->
<button class="keypad-btn bg-surface-container hover:bg-surface-container-high text-on-surface font-display-lg text-display-lg rounded-2xl shadow-sm active:scale-95 transition-all flex items-center justify-center" data-val="1">1</button>
<button class="keypad-btn bg-surface-container hover:bg-surface-container-high text-on-surface font-display-lg text-display-lg rounded-2xl shadow-sm active:scale-95 transition-all flex items-center justify-center" data-val="2">2</button>
<button class="keypad-btn bg-surface-container hover:bg-surface-container-high text-on-surface font-display-lg text-display-lg rounded-2xl shadow-sm active:scale-95 transition-all flex items-center justify-center" data-val="3">3</button>
<button class="keypad-btn bg-surface-container hover:bg-surface-container-high text-on-surface font-display-lg text-display-lg rounded-2xl shadow-sm active:scale-95 transition-all flex items-center justify-center" data-val="4">4</button>
<button class="keypad-btn bg-surface-container hover:bg-surface-container-high text-on-surface font-display-lg text-display-lg rounded-2xl shadow-sm active:scale-95 transition-all flex items-center justify-center" data-val="5">5</button>
<button class="keypad-btn bg-surface-container hover:bg-surface-container-high text-on-surface font-display-lg text-display-lg rounded-2xl shadow-sm active:scale-95 transition-all flex items-center justify-center" data-val="6">6</button>
<button class="keypad-btn bg-surface-container hover:bg-surface-container-high text-on-surface font-display-lg text-display-lg rounded-2xl shadow-sm active:scale-95 transition-all flex items-center justify-center" data-val="7">7</button>
<button class="keypad-btn bg-surface-container hover:bg-surface-container-high text-on-surface font-display-lg text-display-lg rounded-2xl shadow-sm active:scale-95 transition-all flex items-center justify-center" data-val="8">8</button>
<button class="keypad-btn bg-surface-container hover:bg-surface-container-high text-on-surface font-display-lg text-display-lg rounded-2xl shadow-sm active:scale-95 transition-all flex items-center justify-center" data-val="9">9</button>
<!-- Clear -->
<button class="bg-error-container text-on-error-container font-headline-md text-headline-md rounded-2xl shadow-sm active:scale-95 transition-all flex items-center justify-center" id="btn-clear">XÓA</button>
<!-- Key 0 -->
<button class="keypad-btn bg-surface-container hover:bg-surface-container-high text-on-surface font-display-lg text-display-lg rounded-2xl shadow-sm active:scale-95 transition-all flex items-center justify-center" data-val="0">0</button>
<!-- Backspace -->
<button class="bg-surface-variant text-on-surface-variant rounded-2xl shadow-sm active:scale-95 transition-all flex items-center justify-center" id="btn-back">
<span class="material-symbols-outlined text-[48px]">backspace</span>
</button>
</div>
</section>
<!-- Vertical Divider (Visual separation) -->
<div class="hidden lg:block w-1 bg-surface-container-highest rounded-full my-12 opacity-50"></div>
<!-- Right Pane: Select Size -->
<section class="flex-1 flex flex-col gap-6 h-full bg-surface-container-lowest rounded-3xl p-8 border border-outline-variant shadow-[0_4px_12px_rgba(0,0,0,0.05)]">
<header class="flex items-center gap-4 border-b border-outline-variant pb-4">
<div class="w-12 h-12 rounded-full bg-surface-variant flex items-center justify-center text-on-surface-variant font-headline-lg text-headline-lg border-2 border-outline-variant">2</div>
<h2 class="font-headline-lg text-headline-lg text-on-surface">Chọn Kích Thước</h2>
</header>
<div class="flex flex-col gap-6 flex-1 mt-2">
<!-- Size S -->
<div class="size-card flex-1 flex items-center justify-between px-10 rounded-2xl border-4 border-outline-variant bg-surface hover:bg-surface-container-low cursor-pointer transition-all active:scale-[0.98]" data-size="S">
<div class="flex items-center gap-8">
<span class="material-symbols-outlined icon-bold text-[64px] text-primary">package_2</span>
<div class="flex flex-col">
<span class="font-display-lg text-display-lg text-on-surface">SIZE S</span>
<span class="font-body-lg text-body-lg text-on-surface-variant">Thư từ, gói nhỏ</span>
</div>
</div>
<div class="w-10 h-10 rounded-full border-4 border-outline-variant flex items-center justify-center radio-indicator">
<div class="w-4 h-4 rounded-full bg-primary opacity-0 inner-dot transition-opacity"></div>
</div>
</div>
<!-- Size M -->
<div class="size-card flex-1 flex items-center justify-between px-10 rounded-2xl border-4 border-outline-variant bg-surface hover:bg-surface-container-low cursor-pointer transition-all active:scale-[0.98]" data-size="M">
<div class="flex items-center gap-8">
<span class="material-symbols-outlined icon-bold text-[80px] text-primary">package_2</span>
<div class="flex flex-col">
<span class="font-display-lg text-display-lg text-on-surface">SIZE M</span>
<span class="font-body-lg text-body-lg text-on-surface-variant">Hộp giày, quần áo</span>
</div>
</div>
<div class="w-10 h-10 rounded-full border-4 border-outline-variant flex items-center justify-center radio-indicator">
<div class="w-4 h-4 rounded-full bg-primary opacity-0 inner-dot transition-opacity"></div>
</div>
</div>
<!-- Size L -->
<div class="size-card flex-1 flex items-center justify-between px-10 rounded-2xl border-4 border-outline-variant bg-surface hover:bg-surface-container-low cursor-pointer transition-all active:scale-[0.98]" data-size="L">
<div class="flex items-center gap-8">
<span class="material-symbols-outlined icon-bold text-[100px] text-primary">package_2</span>
<div class="flex flex-col">
<span class="font-display-lg text-display-lg text-on-surface">SIZE L</span>
<span class="font-body-lg text-body-lg text-on-surface-variant">Thùng carton lớn</span>
</div>
</div>
<div class="w-10 h-10 rounded-full border-4 border-outline-variant flex items-center justify-center radio-indicator">
<div class="w-4 h-4 rounded-full bg-primary opacity-0 inner-dot transition-opacity"></div>
</div>
</div>
</div>
</section>
</main>
<!-- Kiosk Bottom Actions (Bottom 15%) -->
<footer class="h-[15%] min-h-[120px] bg-surface-container-lowest border-t-2 border-outline-variant shadow-[0_-8px_24px_rgba(0,0,0,0.05)] px-container-margin-desktop flex items-center justify-between z-20">
<button class="h-kiosk-touch-target min-h-[80px] px-12 rounded-xl border-4 border-primary text-primary font-headline-lg text-headline-lg active:bg-primary-container active:text-on-primary-container transition-colors flex items-center gap-4" id="btn-back-flow">
<span class="material-symbols-outlined icon-bold text-[40px]">arrow_back</span>
            QUAY LẠI
        </button>
<button class="h-kiosk-touch-target min-h-[80px] px-16 rounded-xl bg-primary text-on-primary font-headline-lg text-headline-lg shadow-lg active:scale-95 hover:bg-surface-tint transition-all flex items-center gap-4 opacity-50 cursor-not-allowed" id="btn-continue">
            TIẾP TỤC
            <span class="material-symbols-outlined icon-bold text-[40px]">arrow_forward</span>
</button>
</footer>
<script>
        // Kiosk Interaction Logic
        const display = document.getElementById('room-display');
        const placeholder = document.getElementById('room-placeholder');
        const container = document.getElementById('display-container');
        const btnContinue = document.getElementById('btn-continue');
        const btnBackFlow = document.getElementById('btn-back-flow');
        let currentInput = "";
        let selectedSize = null;
        const MAX_DIGITS = 4;

        // Keypad Logic
        document.querySelectorAll('.keypad-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                if(currentInput.length < MAX_DIGITS) {
                    currentInput += btn.dataset.val;
                    updateDisplay();
                }
            });
        });

        document.getElementById('btn-back').addEventListener('click', () => {
            currentInput = currentInput.slice(0, -1);
            updateDisplay();
        });

        document.getElementById('btn-clear').addEventListener('click', () => {
            currentInput = "";
            updateDisplay();
        });

        function updateDisplay() {
            display.textContent = currentInput;
            placeholder.textContent = currentInput.padEnd(MAX_DIGITS, "_").substring(currentInput.length);

            if(currentInput.length > 0) {
                container.classList.add('border-primary');
                container.classList.remove('border-outline');
            } else {
                container.classList.remove('border-primary');
                container.classList.add('border-outline');
            }
            checkState();
        }

        // Size Selection Logic
        document.querySelectorAll('.size-card').forEach(card => {
            card.addEventListener('click', () => {
                // Reset all
                document.querySelectorAll('.size-card').forEach(c => {
                    c.classList.remove('border-primary', 'bg-primary-fixed');
                    c.classList.add('border-outline-variant', 'bg-surface');
                    c.querySelector('.radio-indicator').classList.remove('border-primary');
                    c.querySelector('.radio-indicator').classList.add('border-outline-variant');
                    c.querySelector('.inner-dot').classList.remove('opacity-100');
                    c.querySelector('.inner-dot').classList.add('opacity-0');
                });

                // Set active
                card.classList.add('border-primary', 'bg-primary-fixed');
                card.classList.remove('border-outline-variant', 'bg-surface');
                card.querySelector('.radio-indicator').classList.add('border-primary');
                card.querySelector('.radio-indicator').classList.remove('border-outline-variant');
                card.querySelector('.inner-dot').classList.remove('opacity-0');
                card.querySelector('.inner-dot').classList.add('opacity-100');

                selectedSize = card.dataset.size;
                checkState();
            });
        });

        // Validation Logic
        function checkState() {
            if (currentInput.length === MAX_DIGITS && selectedSize !== null) {
                btnContinue.classList.remove('opacity-50', 'cursor-not-allowed');
                btnContinue.classList.add('shadow-xl', 'animate-pulse'); // Subtle call to action
            } else {
                btnContinue.classList.add('opacity-50', 'cursor-not-allowed');
                btnContinue.classList.remove('shadow-xl', 'animate-pulse');
            }
        }

        btnBackFlow.addEventListener('click', () => {
            window.location.href = '/Locker/01-Home/index.html';
        });

        btnContinue.addEventListener('click', () => {
            const isValid = currentInput.length === MAX_DIGITS && selectedSize !== null;
            if (!isValid) {
                alert('Vui lòng nhập đủ 4 số phòng và chọn kích thước tủ.');
                return;
            }

            const query = new URLSearchParams({
                room: currentInput,
                size: selectedSize
            });
            window.location.href = `/Locker/04-Ma-van-don/index.html?${query.toString()}`;
        });
    </script>
</body></html>
