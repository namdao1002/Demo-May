<!DOCTYPE html><html lang="vi"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport">
<title>Kiosk - Giao hàng</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<style>
        body {
            font-family: 'Inter', sans-serif;
            /* Prevent scrolling on kiosk */
            overflow: hidden;
            touch-action: none;
        }

        .material-symbols-outlined {
            font-family: 'Material Symbols Outlined';
            font-weight: normal;
            font-style: normal;
            font-size: 24px;
            line-height: 1;
            letter-spacing: normal;
            text-transform: none;
            display: inline-block;
            white-space: nowrap;
            word-wrap: normal;
            direction: ltr;
            -webkit-font-feature-settings: 'liga';
            -webkit-font-smoothing: antialiased;
        }

        /* Kiosk specific animations */
        @keyframes subtle-pulse {
            0% { transform: scale(1); opacity: 0.8; }
            50% { transform: scale(1.05); opacity: 1; }
            100% { transform: scale(1); opacity: 0.8; }
        }
        .animate-kiosk-pulse {
            animation: subtle-pulse 2s infinite ease-in-out;
        }
    </style>
<script id="tailwind-config">
        tailwind.config = {
          darkMode: "class",
          theme: {
            extend: {
              "colors": {
                      "surface-variant": "#d8e2ff",
                      "on-error-container": "#93000a",
                      "inverse-surface": "#1d3054",
                      "error": "#ba1a1a",
                      "on-tertiary-container": "#33e6ff",
                      "primary": "#003d9b",
                      "on-tertiary-fixed": "#001f24",
                      "on-secondary-fixed": "#001e2f",
                      "surface-container-highest": "#d8e2ff",
                      "surface-bright": "#faf9ff",
                      "secondary": "#006492",
                      "surface-container-high": "#e1e8ff",
                      "on-surface-variant": "#434654",
                      "tertiary-container": "#006470",
                      "secondary-container": "#0cb3ff",
                      "on-secondary-fixed-variant": "#004b6f",
                      "on-surface": "#051a3e",
                      "tertiary-fixed": "#9cf0ff",
                      "surface": "#faf9ff",
                      "outline-variant": "#c3c6d6",
                      "primary-fixed": "#dae2ff",
                      "primary-container": "#0052cc",
                      "error-container": "#ffdad6",
                      "surface-container": "#e9edff",
                      "tertiary-fixed-dim": "#00daf3",
                      "surface-container-low": "#f1f3ff",
                      "on-primary-fixed": "#001848",
                      "on-tertiary": "#ffffff",
                      "secondary-fixed": "#c9e6ff",
                      "inverse-on-surface": "#edf0ff",
                      "on-secondary": "#ffffff",
                      "secondary-fixed-dim": "#8bceff",
                      "on-primary": "#ffffff",
                      "on-background": "#051a3e",
                      "on-tertiary-fixed-variant": "#004f58",
                      "tertiary": "#004a54",
                      "surface-tint": "#0c56d0",
                      "on-secondary-container": "#004261",
                      "surface-container-lowest": "#ffffff",
                      "on-primary-container": "#c4d2ff",
                      "on-primary-fixed-variant": "#0040a2",
                      "on-error": "#ffffff",
                      "primary-fixed-dim": "#b2c5ff",
                      "outline": "#737685",
                      "background": "#faf9ff",
                      "inverse-primary": "#b2c5ff",
                      "surface-dim": "#ccdaff"
              },
              "borderRadius": {
                      "DEFAULT": "0.25rem",
                      "lg": "0.5rem",
                      "xl": "0.75rem",
                      "full": "9999px",
                      "kiosk": "1.5rem"
              },
              "spacing": {
                      "container-margin-desktop": "32px",
                      "kiosk-touch-target": "64px",
                      "kiosk-button-height": "120px",
                      "gutter": "16px",
                      "container-margin-mobile": "16px",
                      "unit": "8px",
                      "touch-target-min": "48px"
              },
              "fontFamily": {
                      "headline-md": ["Inter"],
                      "headline-lg": ["Inter"],
                      "display-lg-mobile": ["Inter"],
                      "label-md": ["Inter"],
                      "body-md": ["Inter"],
                      "body-lg": ["Inter"],
                      "label-sm": ["Inter"],
                      "display-lg": ["Inter"]
              },
              "fontSize": {
                      "headline-md": ["24px", {"lineHeight": "32px", "fontWeight": "600"}],
                      "headline-lg": ["32px", {"lineHeight": "40px", "letterSpacing": "-0.01em", "fontWeight": "600"}],
                      "display-lg-mobile": ["36px", {"lineHeight": "44px", "letterSpacing": "-0.02em", "fontWeight": "700"}],
                      "label-md": ["14px", {"lineHeight": "20px", "letterSpacing": "0.01em", "fontWeight": "500"}],
                      "body-md": ["16px", {"lineHeight": "24px", "fontWeight": "400"}],
                      "body-lg": ["18px", {"lineHeight": "28px", "fontWeight": "400"}],
                      "label-sm": ["12px", {"lineHeight": "16px", "letterSpacing": "0.03em", "fontWeight": "600"}],
                      "display-lg": ["48px", {"lineHeight": "56px", "letterSpacing": "-0.02em", "fontWeight": "700"}]
              }
            }
          }
        }
    </script>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
</head>
<body class="bg-background text-on-background h-screen w-screen flex flex-col items-center justify-center select-none relative">
<header class="absolute top-8 left-8 z-20">
<button class="h-kiosk-touch-target px-10 rounded-xl border-4 border-primary text-primary font-headline-md text-headline-md active:bg-primary-container active:text-on-primary-container transition-colors flex items-center gap-3" id="btn-back">
<span class="material-symbols-outlined">arrow_back</span>
            QUAY LẠI
        </button>
</header>
<!-- Kiosk Content Canvas (Centered 60% vertical focus) -->
<main class="w-full max-w-6xl px-container-margin-desktop flex flex-row items-center justify-center gap-16">
<!-- Status Visual Area -->
<div class="flex flex-col items-center gap-8 w-1/2">
<!-- Animated Icon Container indicating an open state -->
<div class="relative flex items-center justify-center w-64 h-64 bg-surface-container rounded-full shadow-[0_12px_48px_-12px_rgba(0,61,155,0.15)] animate-kiosk-pulse border-[8px] border-surface-container-high">
<span class="material-symbols-outlined text-[120px] text-primary" style="font-variation-settings: 'FILL' 1, 'wght' 300;">
                    door_open
                </span>
<!-- Abstract ring to add depth and focus -->
<div class="absolute inset-[-16px] rounded-full border-2 border-primary-fixed-dim opacity-30"></div>
<div class="absolute inset-[-32px] rounded-full border border-primary-fixed opacity-10"></div>
</div>
<!-- Main Headline -->
<h1 class="text-display-lg font-display-lg text-primary text-center" id="locker-id">
                ĐANG MỞ Ô A-102
            </h1>
</div>
<!-- Action Area -->
<div class="w-1/2 flex flex-col gap-6">
<!-- Primary Success Action (Blue/Green intent) -->
<button class="w-full h-kiosk-button-height bg-primary text-on-primary rounded-kiosk flex items-center justify-center gap-6 shadow-lg active:scale-[0.98] transition-transform overflow-hidden relative group" id="btn-complete">
<div class="absolute inset-0 bg-white opacity-0 group-active:opacity-10 transition-opacity"></div>
<span class="material-symbols-outlined text-[48px]" style="font-variation-settings: 'FILL' 1;">
                    check_circle
                </span>
<span class="text-headline-lg font-headline-lg tracking-wide uppercase">
                    Hoàn tất
                </span>
</button>
<!-- Secondary/Error Action (Huge Red Button) -->
<button class="w-full h-kiosk-button-height bg-error text-on-error rounded-kiosk flex items-center justify-center gap-6 shadow-lg active:scale-[0.98] transition-transform overflow-hidden relative group" id="btn-full">
<div class="absolute inset-0 bg-black opacity-0 group-active:opacity-10 transition-opacity"></div>
<span class="material-symbols-outlined text-[48px]" style="font-variation-settings: 'FILL' 1;">
                    warning
                </span>
<span class="text-headline-lg font-headline-lg tracking-wide uppercase">
                    Ô đã đầy - Đổi ô khác
                </span>
</button>
</div>
</main>
<script>
        const params = new URLSearchParams(window.location.search);
        const room = params.get('room');
        const size = params.get('size');

        const lockerId = document.getElementById('locker-id');
        const btnBack = document.getElementById('btn-back');
        const btnComplete = document.getElementById('btn-complete');
        const btnFull = document.getElementById('btn-full');

        if (room && size) {
            lockerId.textContent = `ĐANG MỞ Ô ${size}-${room}`;
        }

        btnBack.addEventListener('click', () => {
            window.location.href = '/Locker/04-Ma-van-don/index.html';
        });

        btnComplete.addEventListener('click', () => {
            alert('Giao hàng thành công!');
            window.location.href = '/Locker/01-Home/index.html';
        });

        btnFull.addEventListener('click', () => {
            alert('Vui lòng chọn ô khác.');
            window.location.href = '/Locker/03-Don-hang/index.html';
        });
    </script>
</body></html>
