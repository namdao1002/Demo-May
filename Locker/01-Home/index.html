<!DOCTYPE html><html class="light" lang="vi" style=""><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>Kinetic Kiosk Home</title>
<!-- Google Fonts -->
<link href="https://fonts.googleapis.com" rel="preconnect">
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&amp;display=swap" rel="stylesheet">
<!-- Material Symbols -->
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
        tailwind.config = {
          darkMode: "class",
          theme: {
            extend: {
              "colors": {
                      "surface-container-low": "#f1f3ff",
                      "tertiary-container": "#006470",
                      "tertiary": "#004a54",
                      "on-error": "#ffffff",
                      "on-secondary-fixed-variant": "#004b6f",
                      "surface": "#faf9ff",
                      "inverse-primary": "#b2c5ff",
                      "primary": "#003d9b",
                      "secondary-fixed-dim": "#8bceff",
                      "background": "#faf9ff",
                      "surface-bright": "#faf9ff",
                      "primary-fixed": "#dae2ff",
                      "outline": "#737685",
                      "surface-tint": "#0c56d0",
                      "on-error-container": "#93000a",
                      "on-secondary-container": "#004261",
                      "surface-container": "#e9edff",
                      "outline-variant": "#c3c6d6",
                      "primary-fixed-dim": "#b2c5ff",
                      "error": "#ba1a1a",
                      "on-secondary-fixed": "#001e2f",
                      "on-secondary": "#ffffff",
                      "surface-variant": "#d8e2ff",
                      "surface-container-lowest": "#ffffff",
                      "secondary-fixed": "#c9e6ff",
                      "secondary-container": "#0cb3ff",
                      "secondary": "#006492",
                      "on-primary-container": "#c4d2ff",
                      "on-surface-variant": "#434654",
                      "tertiary-fixed-dim": "#00daf3",
                      "on-surface": "#051a3e",
                      "on-primary-fixed-variant": "#0040a2",
                      "on-tertiary-container": "#33e6ff",
                      "on-primary-fixed": "#001848",
                      "inverse-on-surface": "#edf0ff",
                      "surface-container-highest": "#d8e2ff",
                      "tertiary-fixed": "#9cf0ff",
                      "on-tertiary-fixed": "#001f24",
                      "on-tertiary-fixed-variant": "#004f58",
                      "primary-container": "#0052cc",
                      "error-container": "#ffdad6",
                      "on-background": "#051a3e",
                      "surface-container-high": "#e1e8ff",
                      "inverse-surface": "#1d3054",
                      "on-primary": "#ffffff",
                      "surface-dim": "#ccdaff",
                      "on-tertiary": "#ffffff"
              },
              "borderRadius": {
                      "DEFAULT": "0.25rem",
                      "lg": "0.5rem",
                      "xl": "0.75rem",
                      "full": "9999px"
              },
              "spacing": {
                      "container-margin-desktop": "32px",
                      "container-margin-mobile": "16px",
                      "kiosk-touch-target": "64px",
                      "touch-target-min": "48px",
                      "gutter": "16px",
                      "unit": "8px"
              },
              "fontFamily": {
                      "headline-md": ["Inter"],
                      "display-lg-mobile": ["Inter"],
                      "label-sm": ["Inter"],
                      "headline-lg": ["Inter"],
                      "body-md": ["Inter"],
                      "body-lg": ["Inter"],
                      "display-lg": ["Inter"],
                      "label-md": ["Inter"]
              },
              "fontSize": {
                      "headline-md": ["24px", { "lineHeight": "32px", "fontWeight": "600" }],

                      "label-md": ["14px", { "lineHeight": "20px", "letterSpacing": "0.01em", "fontWeight": "500" }]

            }
          }

<style>
        /* Ambient Background Pattern for Kiosk Depth */
        .kiosk-bg {
            background-color: theme('colors.surface-container-low');
            background-image: radial-gradient(theme('colors.primary-fixed') 1px, transparent 1px);
            background-size: 40px 40px;
        }

        /* Specific Kiosk Button Shadow (Level 2 variant for massive buttons) */
        .kiosk-shadow {
            box-shadow: 0 12px 32px -4px rgba(0, 24, 72, 0.15), 0 4px 12px -2px rgba(0, 24, 72, 0.1);
        }
    </style>
<style>
    body {
      min-height: max(768px, 100dvh);
    }
  </style>
</head>
<body class="kiosk-bg h-screen w-screen overflow-hidden flex flex-col items-center justify-center relative selection:bg-primary-container selection:text-on-primary-container">
<!-- Main Content Area -->
<main class="w-full flex flex-col items-center justify-center px-8 md:px-16 z-10 max-w-7xl mx-auto gap-12">
<!-- Header -->
<div class="text-center flex flex-col items-center max-w-5xl">
<span class="material-symbols-outlined text-[64px] text-primary mb-6" style="font-variation-settings: 'FILL' 1;">package_2</span>
<h1 class="font-display-lg text-[56px] text-on-surface tracking-tight leading-tight">
                XIN CHÀO! VUI LÒNG CHỌN DỊCH VỤ
            </h1>
<p class="font-headline-lg text-headline-lg text-on-surface-variant mt-4 font-normal">
                Chạm vào màn hình để bắt đầu
            </p>
</div>
<!-- Massive Action Buttons -->
<div class="grid grid-cols-2 gap-12 w-full max-w-6xl">
<!-- Shipper Button -->
<button class="group relative flex flex-col items-center justify-center bg-surface-container-lowest border-4 border-outline-variant hover:border-primary active:bg-surface-container-low rounded-2xl p-12 kiosk-shadow transition-all duration-200 active:scale-[0.98] focus:outline-none focus:ring-4 focus:ring-primary-fixed min-h-[400px]" id="btn-shipper">
<div class="absolute inset-0 bg-gradient-to-b from-transparent to-surface-container-low opacity-0 group-hover:opacity-100 transition-opacity rounded-2xl pointer-events-none"></div>
<div class="h-40 w-40 rounded-full bg-surface-variant flex items-center justify-center mb-10 group-hover:bg-primary-fixed transition-colors">
<span class="material-symbols-outlined text-[88px] text-primary" data-icon="local_shipping" style="font-variation-settings: 'FILL' 1;">local_shipping</span>
</div>
<span class="font-display-lg text-display-lg text-on-surface text-center group-hover:text-primary transition-colors">SHIPPER<br>GIAO HÀNG</span>
</button>
<!-- Resident Button (Primary Style) -->
<button class="group relative flex flex-col items-center justify-center bg-primary text-on-primary border-4 border-transparent hover:bg-primary-container hover:text-on-primary-container rounded-2xl p-12 kiosk-shadow transition-all duration-200 active:scale-[0.98] focus:outline-none focus:ring-4 focus:ring-primary-fixed min-h-[400px] overflow-hidden" id="btn-resident">
<div class="absolute top-0 right-0 w-64 h-64 bg-white opacity-5 rounded-full blur-3xl transform translate-x-1/3 -translate-y-1/3 pointer-events-none"></div>
<div class="h-40 w-40 rounded-full bg-white/20 flex items-center justify-center mb-10 backdrop-blur-sm group-hover:bg-white/30 transition-colors">
<span class="material-symbols-outlined text-[88px] text-white" data-icon="person_pin" style="font-variation-settings: 'FILL' 1;">person_pin</span>
</div>
<span class="font-display-lg text-display-lg text-center leading-tight">CƯ DÂN<br>NHẬN HÀNG</span>
</button>
</div>
</main>
<script>
        document.getElementById("btn-shipper").addEventListener("click", () => {
            window.location.href = "/Locker/03-Don-hang/index.html";
        });

        document.getElementById("btn-resident").addEventListener("click", () => {
            window.location.href = "/Locker/02-Nhan-hang/index.html";
        });
    </script>
</body></html>
